[workspace]
members = [
    "app",
    "compat",
    "jsonschemagen",
    "lib"
]
resolver = "2"

[workspace.package]
version = "0.11.0"
authors = ["David McKay <david@rawkode.dev>", "Benjamin Stürmer <benjamin@stuermer.pro>"]
edition = "2021"
# Keep in sync with MIN_SUPPORTED_RUST_VERSION in .github/workflows
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/comtrya/comtrya"
homepage = "https://comtrya.dev"
readme = "README.md"

# A subset of `clippy::pedantic` that makes the code easier to read. CI denies warnings, so
# these fail the build. `missing_errors_doc` is on for the library only, in `lib/src/lib.rs`
[workspace.lints.clippy]
manual_let_else = "warn"
needless_raw_string_hashes = "warn"
redundant_closure_for_method_calls = "warn"
semicolon_if_nothing_returned = "warn"
single_match_else = "warn"

[workspace.dependencies]
comtrya-lib = { path = "lib", version = "0.11.0" }

age = { version = "0.12", features = ["armor"] }
anyhow = "1.0"
clap = { version = "4.5.60", features = ["derive"] }
clap_complete = "4.5.66"
colored = "3.1"
comfy-table = "8"
ctrlc = "3.5.2"
dirs = "7.0"
flate2 = "1.1.9"
gethostname = "1.1"
# Only what comtrya calls: clone, fetch and check out a worktree. The defaults also build merge,
# blame, mailmap, archives and notes
gix = { version = "0.90.0", default-features = false, features = [
    "max-performance",
    "sha1",
    "auto-chain-error",
    "worktree-mutation",
    "credentials",
    "interrupt",
    "tracing",
    "tracing-detail",
    # TLS comes from comtrya's own reqwest, with the ring crypto provider
    "blocking-http-transport-reqwest",
    "blocking-network-client",
] }
# `dns:` includes always ask Google's resolvers, so the system's resolver config isn't read
hickory-resolver = { version = "0.26.2", default-features = false, features = ["tokio"] }
ignore = "0.4"
normpath = "1.5"
os_info = { version = "3.14", features = ["schemars"] }
petgraph = "0.8"
regex = "1.12"
# `rustls-no-provider`: TLS uses ring, see `comtrya_lib::tls`. reqwest's default, aws-lc, builds C and
# assembly and was the slowest crate of a release build
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rhai = { version = "1.24", features = ["serde"] }
schemars = "1.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml_ng = "0.10"
sha2 = "0.11"
similar = "3.2"
strip-ansi-escapes = "0.2"
strsim = "0.11"
tar = "0.4.44"
# Tera 2 changes the template language used in manifests
# (e.g. `get_env` was removed, undefined variables error).
# Stay on 1.x until a deliberate migration; see .github/dependabot.yml.
tera = "1.20"
thiserror = "2.0"
tokio = "1.49"
toml = "1.0"
tracing = "0.1"
tracing-journald = "0.3.2"
tracing-subscriber = "0.3"
# The crates.io check only; its HTTP client is ours, on reqwest, see `app/src/update_client.rs`.
# Its default ureq client would build a second TLS stack (ring)
update-informer = { version = "1.3", default-features = false, features = ["crates"] }
uzers = "0.12"
which = "8.0"
whoami = "2.1"

# Only for tests
assert_cmd = "2.1"
jsonschema = { version = "0.60", default-features = false }
predicates = "3.1"
pretty_assertions = "1.4"
tempfile = "3.26"
walkdir = "2.5"

# Dependencies build without debug info: faster debug builds and a smaller target dir. Backtraces
# still name the functions, they only lose variables inside dependencies
[profile.dev.package."*"]
debug = "line-tables-only"
