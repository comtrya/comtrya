version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      # Keeps PR titles in Conventional Commits form ("chore(deps): ..."), see pr-title.yaml
      prefix: "chore"
      include: "scope"
    groups:
      all-dependencies-cargo:
        patterns:
          - "*"
    ignore:
      # Tera 2 breaks user manifest templates, see the comment in lib/Cargo.toml
      - dependency-name: "tera"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      # Keeps PR titles in Conventional Commits form ("chore(deps): ..."), see pr-title.yaml
      prefix: "chore"
      include: "scope"
    groups:
      all-dependencies-actions:
        patterns:
          - "*"
