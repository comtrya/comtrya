version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      all-dependencies-cargo:
        patterns:
          - "*"
    ignore:
      # Tera 2 breaks user manifest templates, see the comment in lib/Cargo.toml
      - dependency-name: "tera"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      all-dependencies-actions:
        patterns:
          - "*"
