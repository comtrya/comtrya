name: pull-request

env:
  MIN_SUPPORTED_RUST_VERSION: "1.88.0"

on:
  pull_request:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: ${{ env.MIN_SUPPORTED_RUST_VERSION }}
          components: clippy,rustfmt

      - run: cargo fmt --all -- --check

      # Runs on the minimum supported Rust version, so this also checks that it still builds
      - run: cargo clippy --all-features --all-targets -- -D warnings

  # Advisories, licenses, duplicate versions and sources of the dependencies, see deny.toml
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  # Broken doc links, and public docs that link to private items
  doc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable

      - run: cargo doc --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  # Dependencies that no code uses
  machete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: bnjbvr/cargo-machete@v0.9.1

  test:
    name: ${{ matrix.job.os }} (${{ matrix.job.target }})
    runs-on: ${{ matrix.job.os }}
    strategy:
      fail-fast: false
      matrix:
        job:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: macos-15-intel, target: x86_64-apple-darwin }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
          target: ${{ matrix.job.target }}

      - run: cargo test --target=${{ matrix.job.target }}

  install-scripts:
    name: install scripts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7.0.1

      - if: runner.os == 'Linux'
        run: shellcheck docs/src/install.sh

      # dash is /bin/sh on Ubuntu, so this also catches bash-only syntax
      - if: runner.os != 'Windows'
        run: |
          INSTALL_DIR="$RUNNER_TEMP/bin" sh docs/src/install.sh
          "$RUNNER_TEMP/bin/comtrya" --version

      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:INSTALL_DIR = "$env:RUNNER_TEMP\bin"
          ./docs/src/install.ps1
          & "$env:RUNNER_TEMP\bin\comtrya.exe" --version
