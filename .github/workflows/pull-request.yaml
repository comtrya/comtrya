name: pull-request

env:
  MIN_SUPPORTED_RUST_VERSION: "1.88.0"

on:
  pull_request:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: ${{ env.MIN_SUPPORTED_RUST_VERSION }}
          components: clippy,rustfmt

      - run: cargo fmt --all -- --check

      # Runs on the minimum supported Rust version, so this also checks that it still builds
      - run: cargo clippy --all-features --all-targets -- -D warnings

  test:
    name: ${{ matrix.job.os }} (${{ matrix.job.target }})
    runs-on: ${{ matrix.job.os }}
    strategy:
      fail-fast: false
      matrix:
        job:
          # Some jobs are commented out. Cross currently runs
          # the build in a container, which doesn't have a "proper"
          # setup that allows CACHE_DIR / TMP_DIR etc to exist,
          # meaning that some of the tests pass because it's using `/`
          # and the user isn't root. There's a change to Cross that fixes
          # this, but a version hasn't been released in 8 months.
          # Hopefully we can uncomment these soon.
          # - {
          #     os: ubuntu-20.04,
          #     target: aarch64-unknown-linux-gnu,
          #     use-cross: true,
          #   }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          # - {
          #     os: ubuntu-20.04,
          #     target: x86_64-unknown-linux-musl,
          #     use-cross: true,
          #   }
          - { os: macos-15-intel, target: x86_64-apple-darwin }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v7.0.1

      - shell: bash
        run: |
          case ${{ matrix.job.target }} in
            aarch64-unknown-linux-gnu) sudo apt-get -y update ; sudo apt-get -y install gcc-aarch64-linux-gnu ;;
          esac

      - shell: bash
        run: |
          echo "PROJECT_NAME=$(sed -n 's/^name = "\(.*\)"/\1/p' Cargo.toml)" >> $GITHUB_ENV
          echo "PROJECT_VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)" >> $GITHUB_ENV
          echo "PROJECT_MAINTAINER=$(sed -n 's/^authors = \["\(.*\)"\]/\1/p' Cargo.toml)" >> $GITHUB_ENV
          echo "PROJECT_HOMEPAGE=$(sed -n 's/^homepage = "\(.*\)"/\1/p' Cargo.toml)" >> $GITHUB_ENV

      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
          target: ${{ matrix.job.target }}

      - run: cargo test --target=${{ matrix.job.target }}

  install-scripts:
    name: install scripts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7.0.1

      - if: runner.os == 'Linux'
        run: shellcheck docs/src/install.sh

      # dash is /bin/sh on Ubuntu, so this also catches bash-only syntax
      - if: runner.os != 'Windows'
        run: |
          INSTALL_DIR="$RUNNER_TEMP/bin" sh docs/src/install.sh
          "$RUNNER_TEMP/bin/comtrya" --version

      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:INSTALL_DIR = "$env:RUNNER_TEMP\bin"
          ./docs/src/install.ps1
          & "$env:RUNNER_TEMP\bin\comtrya.exe" --version
