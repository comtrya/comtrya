[package]
name = "comtrya-compat"
version = "0.0.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
description = "Compares manifest loading with the last release, so refactors don't change what existing manifests mean"
publish = false

[dev-dependencies]
comtrya-lib = { path = "../lib" }
# The reference: what users' manifests meant in the last release
released = { package = "comtrya-lib", version = "=0.10.0" }
anyhow = "1.0"
pretty_assertions = "1.4"
# Evaluates manifest `where` like the last release did
rhai = { version = "1.24", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml_ng = "0.10"
