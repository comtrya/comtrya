[package]
name = "comtrya-compat"
description = "Compares manifest loading with the last release, so refactors don't change what existing manifests mean"
version = "0.0.0"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dev-dependencies]
comtrya-lib.workspace = true
# The reference: what users' manifests meant in the last release. Moved by hand after each
# release, so it stays out of the workspace dependencies
released = { package = "comtrya-lib", version = "=0.11.0" }
pretty_assertions.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml_ng.workspace = true
