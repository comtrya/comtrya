[package]
name = "comtrya"
version = "0.10.0"
authors = ["David McKay <david@rawkode.dev>"]
edition = "2021"
# Keep in sync with MIN_SUPPORTED_RUST_VERSION in .github/workflows
rust-version = "1.88"
license = "MIT"
description = "A tool to simplify reprovisioning a fresh OS. Installs packages and manages dotfiles."
repository = "https://github.com/comtrya/comtrya"
homepage = "https://comtrya.dev"
readme = "../README.md"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5.60", features = ["derive"] }
clap_complete = "4.5.66"
colored = "3.1"
comfy-table = "8"
comtrya-lib = { path = "../lib", version = "0.10.0" }
petgraph = "0.8"
strip-ansi-escapes = "0.2"
tracing = "0.1"
tracing-journald = "0.3.2"
tracing-subscriber = "0.3"
update-informer = "1.3"
dirs = "6.0"
serde = { version = "1.0", features = ["derive"] }
serde_yaml_ng = "0.10"
walkdir = "2.5.0"

[dev-dependencies]
assert_cmd = "2.1"
predicates = "3.1"
tempfile = "3.26"
